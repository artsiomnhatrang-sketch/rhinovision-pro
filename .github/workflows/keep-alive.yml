name: Keep Alive

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -sSL --max-time 30 https://rhinovision-pro.streamlit.app/ -o /dev/null \
            && echo "App is alive" \
            || echo "Ping failed (app may be waking up)"
